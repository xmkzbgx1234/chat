# ============================================
# Chat Server Configuration File
# ============================================

# MySQL Database Configuration
[database]
ip=127.0.0.1
port=3306
username=root
password=123456
dbname=chat
initSize=5
maxSize=10
maxIdletime=60
connectionTimeout=1000

# Server Configuration
[server]
host=0.0.0.0
port=8765
threadPoolSize=4
maxConnections=1000
logLevel=info

# Redis Configuration
[redis]
host=127.0.0.1
port=6379
password=
timeout=3000

# Security Configuration
[security]
passwordMinLength=6
passwordMaxLength=128
usernameMinLength=2
usernameMaxLength=64
messageMaxLength=6000
enableKickOff=true
kickOffDelay=0.5

# Performance Configuration
[performance]
sendBufferSize=65536
recvBufferSize=65536
heartbeatInterval=30
keepaliveTimeout=120

# Logging Configuration
[log]
logPath=./logs/
logFile=chatserver.log
maxLogSize=10485760
maxLogFiles=10
enableConsole=true
enableFile=true

# Feature Flags
[features]
enableOfflineMessage=true
enableHistoryMessage=true
enableGroupChat=true
enableFriendSystem=true

# Game Configuration
[game]
gameDuration=60
initialFallSpeed=2
initialSpawnInterval=1500
maxActiveApples=3
initialLives=3
countdownSeconds=3
opponentSyncInterval=200
# Difficulty scaling at seconds 20/40/50
difficultyMilestones=20,40,50
# Speed increase percentages at each milestone
speedIncreasePercent=20,40,60
# Spawn interval decrease percentages at each milestone
spawnDecreasePercent=20,35,50
# Minimum spawn interval in ms
minSpawnInterval=500
# Max active apples at seconds 30/45
maxApplesMilestones=30,45
maxApplesValues=5,7
# Room timeout in seconds (0 = no timeout)
roomTimeout=300
